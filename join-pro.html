<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>הצטרפות בעלי מקצוע | מקצוענים בישראל</title><style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f7ff;color:#18254d;font-family:Heebo,Arial}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}.hero{padding:30px 24px;color:#fff;background:linear-gradient(135deg,#4338ca,#7556fb,#ea62bc);border-radius:0 0 35px 35px}.hero h1{font-size:29px;line-height:1.15;margin:22px 0 9px}.hero p{margin:0;line-height:1.5}.content{padding:24px}.field{margin:17px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3f1;border-radius:13px;padding:13px;background:#fcfcff;font:15px Heebo}.field textarea{min-height:110px}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#5b3df5,#8a65ff);color:#fff;font:800 16px Heebo;cursor:pointer}.primary:disabled{opacity:.7}.note{font-size:13px;color:#68769a;line-height:1.6}.success{display:none;text-align:center;padding:45px 15px}.back{color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="app"><header class="hero"><a class="back" href="index.html">← חזרה לאתר</a><h1>מצטרפים למקצוענים בישראל</h1><p>השאירו פרטים, ואנחנו נבדוק את הבקשה לפני פרסום הפרופיל.</p></header><form class="content" id="applicationForm"><div class="field"><label>שם מלא</label><input id="fullName" required minlength="2"></div><div class="field"><label>טלפון</label><input id="appPhone" type="tel" required pattern="[0-9+() -]{8,20}" placeholder="050-0000000"></div><div class="field"><label>מקצוע</label><select id="appService" required></select></div><div class="field"><label>אזור ועיר</label><select id="appCity" required></select></div><div class="field"><label>ניסיון או תיאור קצר</label><textarea id="appExperience" required minlength="10"></textarea></div><p class="note">הבקשה תעבור לבדיקה לפני פרסום הפרופיל.</p><button class="primary" id="submitButton">שליחת בקשת הצטרפות</button></form><section class="success" id="success"><h2>✓ הבקשה התקבלה</h2><p>נבדוק את הפרטים וניצור קשר בהקדם.</p><a href="index.html">חזרה לאתר</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://umiaegyddytwxdnjscps.supabase.co','sb_publishable_GJ1Z4cv1dEtKGDtwGbX-6g__St1KyEV'),f=document.getElementById('applicationForm'),n=document.getElementById('fullName'),p=document.getElementById('appPhone'),s=document.getElementById('appService'),c=document.getElementById('appCity'),x=document.getElementById('appExperience'),b=document.getElementById('submitButton'),ok=document.getElementById('success');let areas=[];async function load(){const[{data:a},{data:k}]=await Promise.all([db.from('service_areas').select('region,city').eq('is_active',true).order('region').order('city'),db.from('service_categories').select('name').eq('is_active',true).order('name')]);areas=a||[];c.innerHTML=areas.map(v=>`<option value="${v.city}">${v.region} · ${v.city}</option>`).join('');s.innerHTML=(k||[]).map(v=>`<option>${v.name}</option>`).join('')}f.onsubmit=async e=>{e.preventDefault();b.disabled=true;b.textContent='שולחים בקשה…';const a=areas.find(v=>v.city===c.value),{error}=await db.from('professional_applications').insert({full_name:n.value.trim(),phone:p.value.trim(),service:s.value,region:a?.region||'',city:c.value,experience:x.value.trim()});if(error){b.disabled=false;b.textContent='שליחת בקשת הצטרפות';alert('לא ניתן לשלוח כרגע: '+error.message);return}f.style.display='none';ok.style.display='block'};load()</script></body></html>

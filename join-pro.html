<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b3df5"><title>הצטרפות בעלי מקצוע | מקצוענים בישראל</title><style>@import url('https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#f5f7ff;color:#18254d;font-family:Heebo,Arial}.app{max-width:520px;min-height:100vh;margin:auto;background:#fff}.hero{padding:30px 24px;color:#fff;background:linear-gradient(135deg,#4338ca,#7556fb,#ea62bc);border-radius:0 0 35px 35px}.hero h1{font-size:29px;line-height:1.15;margin:22px 0 9px}.hero p{margin:0;line-height:1.5}.content{padding:24px}.field{margin:17px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe3f1;border-radius:13px;padding:13px;background:#fcfcff;font:15px Heebo}.field textarea{min-height:110px}.primary{width:100%;border:0;border-radius:14px;padding:15px;background:linear-gradient(135deg,#5b3df5,#8a65ff);color:#fff;font:800 16px Heebo;cursor:pointer}.note{font-size:13px;color:#68769a;line-height:1.6}.success{display:none;text-align:center;padding:45px 15px}.success b{font-size:24px}.back{color:#fff;text-decoration:none;font-weight:700}</style></head><body><main class="app"><header class="hero"><a class="back" href="index.html">← חזרה לאתר</a><h1>מצטרפים למקצוענים בישראל</h1><p>השאירו פרטים, ואנחנו נבדוק את הבקשה לפני פרסום הפרופיל.</p></header><form class="content" id="form"><div class="field"><label>שם מלא</label><input id="name" required minlength="2"></div><div class="field"><label>טלפון</label><input id="phone" type="tel" required pattern="[0-9+() -]{8,20}" placeholder="050-0000000"></div><div class="field"><label>מקצוע</label><select id="service" required></select></div><div class="field"><label>אזור ועיר</label><select id="city" required></select></div><div class="field"><label>ניסיון או תיאור קצר</label><textarea id="experience" required minlength="10" placeholder="לדוגמה: חשמלאי מוסמך עם 8 שנות ניסיון"></textarea></div><p class="note">הבקשה אינה מפרסמת אותך אוטומטית. ניצור קשר ונאשר את הפרופיל לאחר בדיקה.</p><button class="primary">שליחת בקשת הצטרפות</button></form><section class="success" id="success"><b>✓ הבקשה התקבלה</b><p>נבדוק את הפרטים וניצור קשר בהקדם.</p><a href="index.html">חזרה לאתר</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=window.supabase.createClient('https://umiaegyddytwxdnjscps.supabase.co','sb_publishable_GJ1Z4cv1dEtKGDtwGbX-6g__St1KyEV');let areas=[];async function load(){let[{data:a},{data:c}]=await Promise.all([db.from('service_areas').select('region,city').eq('is_active',true).order('region').order('city'),db.from('service_categories').select('name').eq('is_active',true).order('name')]);areas=a||[];city.innerHTML=areas.map(x=>`<option value="${x.city}">${x.region} · ${x.city}</option>`).join('');service.innerHTML=(c||[]).map(x=>`<option>${x.name}</option>`).join('')}form.onsubmit=async e=>{e.preventDefault();let area=areas.find(x=>x.city===city.value);let{error}=await db.from('professional_applications').insert({full_name:name.value.trim(),phone:phone.value.trim(),service:service.value,region:area?.region||'',city:city.value,experience:experience.value.trim()});if(error)return alert('לא ניתן לשלוח כרגע: '+error.message);form.style.display='none';success.style.display='block'};load()</script></body></html>
